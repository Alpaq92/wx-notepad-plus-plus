<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Function Group / Class">
  <title>Function Group / Class</title>
  <!-- IconPark idiom: 48px grid, teal fill under a black outline. A parent node over two children -
       the pack's heavy outline gives each box enough definition to survive at 16px, which is exactly
       where this concept fails in the lighter packs. -->
  <path stroke="#0ca678" stroke-width="3" stroke-linecap="round" d="M24 16v8M11 33v-9h26v9"/>
  <rect x="17" y="4"  width="14" height="12" rx="3" fill="#0ca678" stroke="#000" stroke-width="2.5"/>
  <rect x="4"  y="33" width="14" height="11" rx="3" fill="#0ca678" stroke="#000" stroke-width="2.5"/>
  <rect x="30" y="33" width="14" height="11" rx="3" fill="#0ca678" stroke="#000" stroke-width="2.5"/>
</svg>
