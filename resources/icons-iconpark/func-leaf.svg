<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Function">
  <title>Function</title>
  <!-- IconPark idiom: 48px grid, teal fill under a black outline. The function as a machine: a solid box
       with something wired into each side. The connectors are teal STROKES butted against the box, not
       white detail inside it - the box is the pack's filled shape, so a knockout mark would compete with
       it. Same construction as this pack's group glyph (filled boxes joined by teal strokes), so both the
       outline and the connectors lighten together under the dark-mode restroke. Box drawn last so it
       covers the stub ends. -->
  <path stroke="#0ca678" stroke-width="3.5" stroke-linecap="round" d="M6.5 24H12"/>
  <path stroke="#0ca678" stroke-width="3.5" stroke-linecap="round" d="M36 24h5.5"/>
  <rect x="12" y="12" width="24" height="24" rx="7" fill="#0ca678" stroke="#000" stroke-width="2.5"/>
</svg>
