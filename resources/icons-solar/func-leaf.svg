<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Function">
  <title>Function</title>
  <!-- Solar idiom: chunky duotone, no outline. A solid rounded square in the light tone with the run
       triangle punched through it in the dark - both flat fills, which is what this pack does. Sits a
       little tighter than the group glyph's frame so the two are not the same silhouette at 16px. -->
  <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="#8ce99a"/>
  <path fill="#2f9e44" d="M9.1 7.6l7 4.4-7 4.4z"/>
</svg>
