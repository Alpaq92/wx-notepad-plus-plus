<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" role="img" aria-label="Function">
  <title>Function</title>
  <!-- Streamline idiom: solid two-tone on a 14px grid - a filled badge with the mark drawn through it in
       the darker tone. A bolt rather than a letterform: filled, not stroked, which is what this pack does
       everywhere else, and a silhouette that still reads at 16px where thin joins close up. -->
  <rect x="0.6" y="0.6" width="12.8" height="12.8" rx="3.4" fill="#69db7c"/>
  <g transform="translate(1.63,1.4) scale(0.467)" fill="#099268">
    <path d="M13 3l-9 11h7l-1 7 9-11h-7l1-7z"/>
  </g>
</svg>
