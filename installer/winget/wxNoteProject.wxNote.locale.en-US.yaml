ShortDescription: A fast, cross-platform text editor built on wxWidgets and Scintilla.
Description: |-
  wxNote is a ground-up, cross-platform text editor built on wxWidgets and wxStyledTextCtrl
  (Scintilla/Lexilla). It runs natively on Windows, Linux and macOS, on x64 and ARM alike, from a
  single codebase.

  It has syntax highlighting for a wide range of languages via Scintillua, a document map, split
  views, multi-caret and column editing, a function list, an integrated terminal, side-by-side file
  comparison, spell checking, theming, and a fully localized UI. It also provides its own permissive
  "Nib" plugin API, plus an optional bridge that loads compiled Notepad++ plugin DLLs on Windows.
